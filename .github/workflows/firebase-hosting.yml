name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22  # حل مشكلة EBADENGINE (capacitor يتطلب >=22)

      - name: Install dependencies
        run: npm ci --ignore-engines   # تجاهل تحذيرات الإصدارات تلقائياً

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: $
          firebaseServiceAccount: $
          projectId: $  # تأكد من صحة اسم المشروع
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
